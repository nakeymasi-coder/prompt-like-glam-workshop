ame": "Catch Flights Not Feelings", "category": "T-Shirt Typography", "title": "Catch Flights Not Feelings"}, {"text": "A vibrant, airbrushed graffiti-style t-shirt graphic features the phrase “YOURTEXT’ in bold, bubble letters filled with a hot pink gradient and outlined in black. The lettering is centered and slightly tilted upward, creating a dynamic and energetic feel, with a soft pink halo gently radiating from the letters. Stylized, cartoon hearts and a small, black crown float playfully above the text, contributing to a confident and urban streetwear vibe, all set against a transparent background to allow for easy placement on various shirt colors. The artwork is rendered with a smooth, almost dreamlike quality, evoking a sense of youthful energy and bold self-expression.", "pack": "Classic Prompts", "num": 53, "name": "YOURTEXT Graffiti Bubble Tee", "category": "T-Shirt Typography", "title": "YOURTEXT Graffiti Bubble Tee"}, {"text": "A cartoon-style illustration depicting a cheerful Stitch seated and lovingly embracing the name “YOURNAME”. Stitch has bright, expressive eyes and a wide, friendly grin, holding the name in a comforting hug with his large, plush hands. The background is a soft, pastel pink with stylized cartoon bubbles floating gently around them, creating a playful and affectionate atmosphere. Soft, diffused lighting enhances the cheerful mood, emphasizing Stitch's endearing gesture and the warmth of the moment.", "pack": "Classic Prompts", "num": 54, "name": "Stitch Hugging YOURNAME", "category": "Chibi Cuties", "title": "Stitch Hugging YOURNAME"}, {"text": "A clipart of a whimsical pastel unicorn with a flowing rainbow mane (soft pink, blue, and lavender). The unicorn is surrounded by glowing sparkles and tiny stars in complementary colors. The text ‘YOUR’TEXT is written in a bubble font with a lavender to gold gradient and a soft shadow. The entire design is positioned on a white background.", "pack": "Classic Prompts", "num": 55, "name": "Pastel Unicorn YOURTEXT", "category": "Chibi Cuties", "title": "Pastel Unicorn YOURTEXT"}, {"text": "A vibrant style t-shirt design showcases the phrase “YOURTEXT in a shimmering, iridescent bubble font, angled upwards to convey a feeling of optimism. The text is centered on a deep charcoal background, accented by playful, animated dollar signs that burst with sparkling pastel pink, lavender, and baby blue starbursts, all bathed in a soft, diffused glow. Surrounding the central text are holographic, pixelated butterflies and swirling, digital-looking ribbons that add to the futuristic, early 2000s aesthetic. The entire design has a holographic shimmer, creating a mesmerizing visual effect that evokes the energy and excitement of the era.", "pack": "Classic Prompts", "num": 56, "name": "Holographic YOURTEXT Tee", "category": "T-Shirt Typography", "title": "Holographic YOURTEXT Tee"}, {"text": "A playful chibi-style cartoon sticker featuring a cheeky pastel purple wallet with money sticking out surrounded by bubbly, shiny pink letters that read “YOURTEXT.” The vibe is humorous and bold, with a touch of sass. The letters have a glossy, almost jelly-like texture and are positioned in a fun, wavy pattern around the object, with motion lines at both ends to emphasize vibration. The background is a bright aqua blue, giving it a vibrant and carefree feel. Perfect for a fun, edgy, and lighthearted vibe", "pack": "Classic Prompts", "num": 57, "name": "Sassy Wallet Chibi Sticker", "category": "Money & Cash", "title": "Sassy Wallet Chibi Sticker"}, {"text": "A vibrant, glossy chibi-style cartoon illustration depicts a confident African American woman radiating boss energy against a bright magenta backdrop. The woman stands centered, her deep brown skin shimmering with a radiant glow, her long flowing jet-black hair cascading around her shoulders, and her eyes closed in joyful laughter revealing a gleaming gold tooth and impeccably manicured nude-pink acrylic nails adorned with bold gold rings. She playfully clutches stacks of vibrant green money in both hands, while subtle sparkles dance around her, and above her head, pink bubble text proclaims “YOURTEXT.” The background consists of dynamic, stylized abstract dollar signs and celebratory confetti, illuminated by soft, diffused lighting to emphasize her carefree expression.", "pack": "Classic Prompts", "num": 58, "name": "Boss Energy Money Queen", "category": "Money & Cash", "title": "Boss Energy Money Queen"}, {"text": "A cheerful, vector-style T-shirt design features the phrase \"Boss Moves Only\" in playful, bubbly lettering. The words are rendered in a gradient of soft pastel pink, lavender, and lemon yellow, playfully arranged in a slightly upward arc with money all around. Delicate sparkles, tiny twinkling stars, and subtle glow accents softly surround the lettering, creating a dreamy, magical effect with smooth gradients and crisp lines. Set against a clean white background, the design features a small, stylized golden starburst positioned directly below the phrase, further emphasizing the positive and uplifting message.", "pack": "Classic Prompts", "num": 59, "name": "Boss Moves Only Tee", "category": "T-Shirt Typography", "title": "Boss Moves Only Tee"}, {"text": "This is a heartwarming Christian birthday greeting card featuring a whimsical sky scene with fluffy, pastel pink clouds and a radiant, golden glow emanating from above, symbolizing divine grace. Numerous chibi hearts in shades of blush pink and shimmering golden star doodles float throughout the scene, gently encircling the phrase “YOURTEXT” in a playful, thick, white bubble font outlined in deep maroon, creating a feeling of comforting affection. The balanced layout centers the text within the dreamy sky backdrop, leaving ample space at the bottom for a personalized message and utilizing a soft, kawaii aesthetic that conveys joy and reassurance, perfect for expressing faith and birthday wishes. The overall design evokes a sense of peace and gentle encouragement, suitable for conveying a heartfelt message to a loved one.", "pack": "Classic Prompts", "num": 60, "name": "Christian Birthday Sky Card", "category": "Faith & Scripture", "title": "Christian Birthday Sky Card"}, {"text": "create a modern artistic portrait of a Black woman wearing glasses and a cap in red, yellow, and green colors symbolizing African culture. The cap has '1865' and 'Juneteenth' written on it. She has brown skin, red lips, voluminous curly hair, and wears African-shaped earrings in red, yellow, and green. The art style is vibrant and colorful, celebrating freedom and Juneteenth", "pack": "Classic Prompts", "num": 61, "name": "Juneteenth Queen Portrait", "category": "Glam Portraits", "title": "Juneteenth Queen Portrait"}, {"text": "“a vibrant Juneteenth-themed decoration featuring the phrase \"1865 FREEDOM DAY\" with bold, multicolored text, fists breaking chains symbolizing liberation, and a heart painted in traditional Pan-African colors (red, green, and black).\" Background is solid white.", "pack": "Classic Prompts", "num": 62, "name": "1865 Freedom Day Art", "category": "Glam Portraits", "title": "1865 Freedom Day Art"}, {"text": "a glamorous sticker design showcases the phrase “YOURTEXT” in a sparkling aesthetic, set against a solid white background with a subtle, radial gradient. The lettering boasts a mesmerizing pink and purple gradient, accented with glittering pink diamonds and a subtle shadowed 3D effect, elegantly centered within a circular frame emitting a radiant halo of shimmering pink glitter sparkles. Below the main text, with pretty pink, full lips blowing a kiss from the top, adding a playful touch. The sticker has a cut-out effect and is softly illuminated by a diffused light source, enhancing the shimmering elements and creating a luxurious feel.", "pack": "Classic Prompts", "num": 63, "name": "YOURTEXT Pink Diamond Sticker", "category": "T-Shirt Typography", "title": "YOURTEXT Pink Diam ": "Exaggerated chibi cartoon of a fashionable Black girl with light brown skin, plump glossy lips and big expressive brown eyes, dressed in a sparkling pearl-studded white two-piece gown. The top features delicate pleated shoulder drapes and beadwork, the skirt a fitted mermaid cut shimmering with rows of pearls. Vintage pin-up curls crown her head in romantic style, lashes dramatic, lips glossy. She poses gracefully before a hot-pink satin backdrop, radiating goddess-like couture glam — serene yet confident, a modern siren muse in chibi form.", "pack": "Cartoon Prompts", "num": 393, "name": "Mermaid — Gown", "category": "Chibi Fashionistas", "title": "Mermaid — Gown"}, {"text": "Glossy chibi-style cartoon of a stylish Black girl with rich brown skin, full glossy lips, big expressive brown eyes and a vintage pin-up spirit. Flawless medium-brown complexion, vivid red lips and matching long red nails. Her black hair is swept into glamorous 1950s curls tied with a black-and-white polka-dot headscarf. She wears white cat-eye sunglasses, a sheer black polka-dot robe with fluffy fur cuffs and a sultry dotted top beneath. She sips a whipped-cream-topped milkshake crowned with a cherry through a straw, looking chic and unbothered against retro diner scenery — sassy and nostalgic.", "pack": "Cartoon Prompts", "num": 394, "name": "Red Cat Sunglasses", "category": "Nails — Glam & Bling", "title": "Red Cat Sunglasses"}, {"text": "Chibi-style cartoon blended with Bratz proportions of a fashionable Black girl with deep brown skin, glossy full lips and big expressive brown eyes, her hair long, straight and platinum blonde. She wears oversized black sunglasses, chunky silver hoop earrings and layered diamond chains with a bold pendant. Her outfit is a sleek black faux-leather bodysuit with a plunging neckline under a luxurious black-and-grey striped faux-fur coat with a dramatic raised hood. Her stance is powerful and commanding, both hands lifting the hood slightly.", "pack": "Cartoon Prompts", "num": 395, "name": "Bratz — Sunglasses Earrings Coat", "category": "Chibi Fashionistas", "title": "Bratz — Sunglasses Earrings Coat"}, {"text": "Studio Ghibli-inspired digital cartoon of a beautiful fair-skinned African American woman with large expressive eyes framed by thick lashes, full glossy lips and long straight teal-green hair. She wears big white oval sunglasses and a chic black jumpsuit dotted with oversized white polka dots, finished with a small front cut-out. She poses playfully, gloved hands framing her puckered lips in a kissy face. A bright mustard-yellow background sets off the look with fun, vibrant contrast — fierce, funky, fully confident, a retro-modern fashion icon.", "pack": "Cartoon Prompts", "num": 396, "name": "Fair Sunglasses", "category": "Fashion & Style", "title": "Fair Sunglasses"}, {"text": "Gouache texture meets Bratz-style airbrushing in this digital cartoon of a gorgeous fair-skinned African American woman with large expressive eyes, thick lashes, full glossy lips and long straight teal-green hair. Oversized white oval sunglasses shade her face while a chic black jumpsuit covered in big white polka dots hugs her figure, a small cut-out at the front. With a playful pose she frames her puckered lips with gloved hands for a kissy-face expression. She stands before a bold mustard-yellow backdrop, a lively vibrant contrast. Her energy is fierce, funky and confident — a retro-modern fashion icon.", "pack": "Cartoon Prompts", "num": 397, "name": "Bratz — Fair Sunglasses", "category": "Bratz Dolls", "title": "Bratz — Fair Sunglasses"}, {"text": "Chibi cartoon of a fashionable Black girl with rich brown skin, plump glossy lips and big expressive brown eyes, bundled in a neon-green fuzzy turtleneck and a hot-pink baseball cap dusted with sparkly green details. A platinum-blonde ponytail peeks from beneath the cap. Dramatic hot-pink lashes frame her eyes and her lips gleam pink. Oversized electric-blue skull earrings dangle with a punk-goth twist. The backdrop is a soft icy-blue gradient that flatters her vivid high-fashion cyber look. Her expression is fierce and confident — bold, glam and playful all at once.", "pack": "Cartoon Prompts", "num": 398, "name": "Neon Earrings (2)", "category": "Chibi Boss & Money", "title": "Neon Earrings (2)"}, {"text": "Exaggerated urban hand-drawn cartoon of a fashionable Black mermaid with light brown skin, glossy full lips and big expressive brown eyes, seated gracefully on a seaside rock. Glowing deep-brown skin, huge sparkling violet eyes and long voluminous waves in pink and purple. Her shimmering tail glitters in violet, fuchsia and touches of aqua. She wears a lavender seashell bra with matching jewelry — beaded bracelets and a pearl anklet — and a translucent flower clip in her hair. Playful dolphins, pink birds in flight and tropical blooms surround her beneath a clear blue sky, sparkling waves and a tiny distant island. Magical, cute, beachy fantasy.", "pack": "Cartoon Prompts", "num": 399, "name": "Mermaid — Ocean Anklet Flowers", "category": "Earrings & Accessories", "title": "Mermaid — Ocean Anklet Flowers"}, {"text": "Chibi cartoon of a fashionable Black girl with light brown skin, glossy full lips and big expressive brown eyes, wrapped in an elegant traditional African headwrap of green, gold and black Ankara fabric with bold geometric prints. Her makeup is flawless — golden highlight, dramatic winged liner, voluminous lashes and glossy brown lips. Ornate gold statement jewelry completes her: a layered beaded necklace and large embellished earrings. Her expression is poised and powerful, radiating royal confidence.", "pack": "Cartoon Prompts", "num": 400, "name": "Necklace Earrings", "category": "Chibi Fashionistas", "title": "Necklace Earrings"}, {"text": "Glossy cartoon portrait of a fashionable Black girl with light brown skin, glossy full lips and big expressive brown eyes, wearing a silky pastel-pink headwrap with intricate patterni function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function highlightPH(s) {
  return esc(s).replace(/YOURNAME|YOURTEXT|YOURSLOGAN|\[DESIRED ETHNICITY\]/g,
    '<span class="ph">$&</span>');
}

function filtered() {
  const q = query.trim().toLowerCase();
  return PROMPTS.filter((p, i) => {
    if (activeChip === "fav" && !favs.has(i)) return false;
    if (activeChip !== "all" && activeChip !== "fav" && p.category !== activeChip) return false;
    if (q && !(p.text.toLowerCase().includes(q) || p.title.toLowerCase().includes(q))) return false;
    return true;
  }).map(p => PROMPTS.indexOf(p));
}

function render() {
  const idxs = filtered();
  const favCount = favs.size;
  statusEl.textContent = idxs.length === PROMPTS.length && !query && activeChip === "all"
    ? "Showing all " + PROMPTS.length + " prompts" + (favCount ? " · " + favCount + " ★ favorited" : "")
    : "Showing " + idxs.length + " of " + PROMPTS.length + " prompts" + (favCount ? " · " + favCount + " ★ favorited" : "");
  if (!idxs.length) {
    grid.innerHTML = '<div class="empty"><div class="big">🔍</div><div>No prompts match that search.<br>Try a different word, boo.</div></div>';
    return;
  }
  grid.innerHTML = idxs.map(i => {
    const p = PROMPTS[i];
    const isFav = favs.has(i);
    const cut = p.text.slice(0, 140);
    const preview = p.text.length > 140 ? cut.slice(0, Math.max(cut.lastIndexOf(" "), 100)) + "…" : p.text;
    return '<div class="card" data-i="' + i + '">' +
      '<div class="card-top"><div class="num">#' + p.num + '</div>' +
      '<div class="catchip">' + esc(p.category) + '</div>' +
      '<div class="packtag">' + esc(p.pack) + '</div></div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<div class="preview">' + esc(preview) + '</div>' +
      '<div class="full">' + highlightPH(p.text) + '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-copy" data-act="copy">📋 Copy prompt</button>' +
        '<button class="btn btn-view" data-act="view">View</button>' +
        '<button class="btn btn-fav' + (isFav ? " on" : "") + '" data-act="fav" title="Save favorite">★</button>' +
      '</div></div>';
  }).join("");
}

function renderChips() {
  chipsEl.innerHTML = CHIPS.map(c =>
    '<button class="chip' + (c.key === activeChip ? " active" : "") + '" data-chip="' + c.key + '">' +
    esc(c.label) + (c.count != null ? ' <span class="n">' + c.count + "</span>" : "") + "</button>"
  ).join("");
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove("show"), 1800);
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => showToast("Copied! ✨ Paste it into your image app."),
      () => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); showToast("Copied! ✨ Paste it into your image app."); }
  catch (e) { showToast("Copy didn't work — long-press the text instead."); }
  document.body.removeChild(ta);
}

chipsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-chip]");
  if (!b) return;
  activeChip = b.dataset.chip;
  renderChips(); render();
  if (statusEl.scrollIntoView) statusEl.scrollIntoView({ behavior: "smooth", block: "start" });
});

  clearTimeout(searchT);
  searchT = setTimeout(() => { query = searchEl.value; renderActive(); }, 160);
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && statusEl.scrollIntoView) statusEl.scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
});

document.getElementById("surprise").addEventListener("click", () => {
  const i = Math.floor(Math.random() * PROMPTS.length);
  activeChip = "all"; query = ""; searchEl.value = "";
  renderChips(); render();
  const raf = window.requestAnimationFrame || function(cb){ return setTimeout(cb, 16); };
  raf(() => {
    const card = grid.querySelector('[data-i="' + i + '"]');
    if (card) {
      card.classList.add("open");
      card.querySelector('[data-act="view"]').textContent = "Hide";
      if (card.scrollIntoView) card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });
  showToast("Your random prompt ✨");
});

grid.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const card = btn.closest(".card");
  const i = parseInt(card.dataset.i, 10);
  const act = btn.dataset.act;
  if (act === "copy") copyText(PROMPTS[i].text);
  else if (act === "view") {
    const open = card.classList.toggle("open");
    btn.textContent = open ? "Hide" : "View";
  }
  else if (act === "fav") {
    if (favs.has(i)) { favs.delete(i); btn.classList.remove("on"); }
    else { favs.add(i); btn.classList.add("on"); showToast("Saved to favorites ★"); }
    saveFavs();
    if (activeChip === "fav") render(); else render();
  }
});

    return;
  }
  gridEl.innerHTML = list.map(b =>
    '<div class="bg-card' + (t.cardCls ? ' ' + t.cardCls : '') + '">' +
    '<img src="' + b.url + '" alt="' + esc(b.name) + '" loading="lazy">' +
    '<div class="bg-name">' + esc(b.name) + '</div>' +
    '<a class="bg-dl" href="' + b.url + '" target="_blank" rel="noopener">⬇ Download</a>' +
    '</div>'
  ).join("");
}

function renderPalettes() {
  const q = query.trim().toLowerCase();
  const list = PALETTES.filter(p => !q || p.name.toLowerCase().includes(q) ||
    p.hexes.some(h => h.toLowerCase().includes(q)));
  statusEl.textContent = list.length === PALETTES.length && !q
    ? "Showing all " + PALETTES.length + " color palettes — tap a swatch to copy its hex"
    : "Showing " + list.length + " of " + PALETTES.length + " color palettes";
  if (!list.length) {
    palGrid.innerHTML = '<div class="empty"><div class="big">🎨</div><div>No palettes match that search.<br>Try "blush", "gold", "pink".</div></div>';
    return;
  }
  palGrid.innerHTML = list.map(p =>
    '<div class="pal-card"><div class="pal-name">' + esc(p.name) +
    ' <span class="pal-vol">Vol.' + p.vol + '</span></div>' +
    '<div class="pal-swatches">' +
    p.hexes.map(h => '<button class="sw" style="background:' + h + '" data-hex="' + h + '" title="Copy ' + h + '"></button>').join("") +
    '</div><div class="pal-hexes">' +
    p.hexes.map(h => '<button class="hex" data-hex="' + h + '">' + h + '</button>').join("") +
    '</div></div>'
  ).join("");
}
palGrid.addEventListener("click", e => {
  const b = e.target.closest("[data-hex]");
  if (!b) return;
  copyText(b.dataset.hex);
});

function renderActive() {
  if (activeTab === "prompts") render();
  else if (activeTab === "palettes") renderPalettes();
  else renderImgTab(activeTab);
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  activeTab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === b));
  const isP = activeTab === "prompts";
  grid.style.display = isP ? "" : "none";
  for (const key of Object.keys(IMG_TABS)) {
    IMG_TABS[key].grid.style.display = (activeTab === key) ? "grid" : "none";
  }
  palGrid.style.display = (activeTab === "palettes") ? "grid" : "none";
  document.getElementById("chips").style.display = isP ? "" : "none";
  document.getElementById("surprise").style.display = isP ? "" : "none";
  searchEl.placeholder = isP
    ? 'Search prompts… try "valentine", "nails", "chibi", "money"'
    : (activeTab === "palettes"
        ? 'Search palettes… try "blush", "gold", "#F2C7CC"'
        : IMG_TABS[activeTab].ph);
  renderActive();
});

renderChips();
render();
</script>
</body>
</html>
