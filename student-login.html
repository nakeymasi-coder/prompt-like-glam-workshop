<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | The Glam Vault</title>
<style>
:root{
  --ivory:#fffdf8;
  --cream:#fff7e8;
  --pearl:#f6efe2;
  --gold:#d7a640;
  --gold2:#b77a18;
  --goldlight:#fff0b7;
  --champagne:#f2d894;
  --ink:#5a3b16;
  --muted:#8a6c46;
  --shadow:0 28px 80px rgba(105,72,22,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{
  min-height:100vh;
  font-family:Montserrat,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 50% 10%,rgba(255,255,255,.98),transparent 27%),
    linear-gradient(180deg,#dcecf5 0%,#f7fbfd 27%,#fff9ed 73%,#fffdf7 100%);
  padding:28px 18px 56px;
}
.wrap{
  width:min(620px,100%);
  margin:0 auto;
}
.card{
  width:100%;
  padding:34px;
  border:1px solid rgba(215,166,64,.42);
  border-radius:28px;
  background:linear-gradient(145deg,#fff,#fff8e9 68%,#f2d894);
  box-shadow:var(--shadow),inset 0 1px #fff;
}
.eyebrow{
  display:block;
  text-align:center;
  color:#a77d39;
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.25em;
  text-transform:uppercase;
}
h1{
  margin:8px 0 10px;
  text-align:center;
  font:700 clamp(2.25rem,8vw,4rem)/.95 Georgia,serif;
  color:#8a5711;
}
.sub{
  text-align:center;
  color:var(--muted);
  line-height:1.6;
  margin:0 0 24px;
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.tabs button,.primary,.ghost,.google{
  min-height:48px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  font:inherit;
}
.tabs button{
  border:1px solid rgba(215,166,64,.35);
  background:#fffaf0;
  color:#8a6c46;
}
.tabs button.active{
  background:linear-gradient(145deg,#f0c868,#b77413);
  color:#fff;
  border-color:#a66d16;
}
.google{
  width:100%;
  border:1px solid rgba(90,59,22,.18);
  background:#fff;
  color:#3c4043;
  box-shadow:0 8px 20px rgba(90,59,22,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.google svg{width:20px;height:20px;flex:0 0 auto}
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:18px 0;
  color:#9b825f;
  font-size:.78rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.1em;
}
.divider::before,.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:rgba(183,122,24,.22);
}
label{
  display:block;
  margin:13px 0 6px;
  font-size:.82rem;
  font-weight:900;
  color:#7e5111;
}
input{
  width:100%;
  min-height:49px;
  padding:0 14px;
  border:1px solid rgba(215,166,64,.38);
  border-radius:12px;
  background:rgba(255,255,255,.9);
  font:inherit;
  color:var(--ink);
  outline:none;
}
input:focus{
  border-color:var(--gold2);
  box-shadow:0 0 0 3px rgba(215,166,64,.14);
}
.primary{
  width:100%;
  margin-top:18px;
  border:1px solid #a66d16;
  background:linear-gradient(145deg,#f0c868,#b77413);
  color:#fff;
  box-shadow:0 9px 20px rgba(154,98,16,.24);
}
.primary:disabled,.google:disabled{opacity:.58;cursor:wait}
.ghost{
  width:100%;
  margin-top:10px;
  border:1px solid rgba(183,122,24,.35);
  background:#fff;
  color:#8a5711;
}
.message{
  min-height:24px;
  margin-top:14px;
  text-align:center;
  color:#8a6c46;
  font-size:.9rem;
  line-height:1.5;
}
.message.success{color:#6f4a0e;font-weight:800}
.message.error{color:#8b3f2a;font-weight:800}
.account{
  display:none;
  margin-top:22px;
  padding:20px;
  border:1px solid rgba(215,166,64,.30);
  border-radius:18px;
  background:rgba(255,255,255,.76);
}
.account.show{display:block}
.account>strong{
  display:block;
  color:#7e5111;
  margin-bottom:6px;
  text-align:center;
}
.small{
  font-size:.78rem;
  color:#927653;
  text-align:center;
  margin:16px 0 0;
  line-height:1.5;
}
@media(max-width:560px){
  body{padding:14px 10px 38px}
  .card{padding:26px 18px}
}
</style>
</head>
<body>
<div class="wrap">
<main class="card">
  <span class="eyebrow">The Glam Vault</span>
  <h1>Welcome Back</h1>
  <p class="sub">Sign in with Google or use your email and password to enter your vault.</p>

  <div id="authPanel">
    <button id="googleButton" class="google" type="button" aria-label="Continue with Google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.805 10.023H12v3.955h5.621c-.242 1.272-.973 2.35-2.071 3.073v2.552h3.352c1.963-1.807 3.096-4.47 3.096-7.603 0-.669-.06-1.312-.193-1.977Z"/><path fill="#34A853" d="M12 22c2.8 0 5.15-.928 6.867-2.397l-3.352-2.552c-.928.622-2.117.99-3.515.99-2.706 0-4.997-1.828-5.816-4.283H2.72v2.632A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.184 13.758A5.996 5.996 0 0 1 5.87 12c0-.61.107-1.204.314-1.758V7.61H2.72A10 10 0 0 0 2 12c0 1.61.385 3.135 1.067 4.39l3.117-2.632Z"/><path fill="#EA4335" d="M12 5.959c1.523 0 2.89.524 3.967 1.55l2.977-2.977C17.145 2.855 14.8 2 12 2A10 10 0 0 0 2.72 7.61l3.464 2.632C7.003 7.787 9.294 5.96 12 5.96Z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <div class="tabs">
      <button id="signInTab" class="active" type="button">Sign In</button>
      <button id="signUpTab" type="button">Create Account</button>
    </div>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>

      <button id="submitButton" class="primary" type="submit">Sign In</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <section id="accountPanel" class="account">
    <strong id="signedInAs"></strong>
    <button id="enterVault" class="primary" type="button">Enter The Glam Vault</button>
    <button id="signOut" class="ghost" type="button">Sign Out</button>
  </section>

  <p class="small">Use the same login each time you return to the vault.</p>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="workshop-access.js"></script>
<script>
let mode = "signin";

const signInTab = document.getElementById("signInTab");
const signUpTab = document.getElementById("signUpTab");
const googleButton = document.getElementById("googleButton");
const form = document.getElementById("authForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const authPanel = document.getElementById("authPanel");
const accountPanel = document.getElementById("accountPanel");
const signedInAs = document.getElementById("signedInAs");

function setMessage(el, text, type=""){
  el.textContent = text || "";
  el.className = `message ${type}`.trim();
}

function setMode(next){
  mode = next;
  signInTab.classList.toggle("active", mode === "signin");
  signUpTab.classList.toggle("active", mode === "signup");
  submitButton.textContent = mode === "signin" ? "Sign In" : "Create Account";
  document.getElementById("password").setAttribute("autocomplete", mode === "signin" ? "current-password" : "new-password");
  setMessage(message, "");
}

signInTab.onclick = () => setMode("signin");
signUpTab.onclick = () => setMode("signup");

async function renderAccount(){
  const session = await GlamWorkshopAccess.getSession();

  if(!session){
    authPanel.style.display = "";
    accountPanel.classList.remove("show");
    return;
  }

  authPanel.style.display = "none";
  accountPanel.classList.add("show");
  signedInAs.textContent = `Signed in as ${session.user.email || "your Google account"}`;
}

googleButton.addEventListener("click", async () => {
  try{
    googleButton.disabled = true;
    setMessage(message, "Opening Google sign in...");
    await GlamWorkshopAccess.signInWithGoogle();
  }catch(error){
    googleButton.disabled = false;
    setMessage(message, error.message || "Google sign in could not start.", "error");
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try{
    submitButton.disabled = true;
    setMessage(message, mode === "signin" ? "Signing you in..." : "Creating your account...");

    if(mode === "signin"){
      await GlamWorkshopAccess.signIn(email,password);
      setMessage(message, "");
      await renderAccount();
    }else{
      const result = await GlamWorkshopAccess.signUp(email,password);

      if(result.session){
        await renderAccount();
      }else{
        setMessage(message, "Account created. Check your email if confirmation is required, then sign in.", "success");
      }
    }
  }catch(error){
    setMessage(message, error.message || "Something went wrong.", "error");
  }finally{
    submitButton.disabled = false;
  }
});

document.getElementById("enterVault").onclick = () => {
  window.location.href = "index.html";
};

document.getElementById("signOut").onclick = async () => {
  await GlamWorkshopAccess.signOut();
  await renderAccount();
};

renderAccount().catch(error => setMessage(message, error.message, "error"));
</script>
</body>
</html>
